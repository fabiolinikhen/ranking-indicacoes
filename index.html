<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏆 Ranking de Indicações</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&display=swap');

:root {
  --bg:      #06060f;
  --surface: #0c0c20;
  --card:    #10103a;
  --border:  #1a1a4a;
  --accent:  #e94560;
  --cyan:    #00d4ff;
  --gold:    #ffd700;
  --silver:  #b8c5d6;
  --bronze:  #cd7f32;
  --green:   #00e676;
  --text:    #dde3f5;
  --muted:   #4a5580;
  --glow-r:  rgba(233,69,96,.5);
  --glow-c:  rgba(0,212,255,.4);
}

*{margin:0;padding:0;box-sizing:border-box}

body{
  background:var(--bg);
  color:var(--text);
  font-family:'Rajdhani',sans-serif;
  min-height:100vh;
  overflow-x:hidden;
}

/* Animated mesh background */
body::before{
  content:'';
  position:fixed;inset:0;z-index:0;
  background:
    radial-gradient(ellipse 90% 50% at 20% 10%, #12002a 0%, transparent 60%),
    radial-gradient(ellipse 60% 40% at 80% 80%, #001a30 0%, transparent 55%),
    radial-gradient(ellipse 40% 30% at 50% 50%, #0a0020 0%, transparent 70%);
  pointer-events:none;
}

#canvas{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.6}

.wrap{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:28px 20px 80px}

/* ── HEADER ── */
header{text-align:center;padding:20px 0 44px;position:relative}

.crown{
  font-size:52px;display:block;
  animation:levitate 4s ease-in-out infinite;
  filter:drop-shadow(0 0 20px var(--gold));
}
@keyframes levitate{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-12px) rotate(3deg)}}

h1{
  font-family:'Orbitron',sans-serif;
  font-size:clamp(20px,4.5vw,40px);
  font-weight:900;
  letter-spacing:4px;
  text-transform:uppercase;
  margin:12px 0 4px;
  background:linear-gradient(100deg, var(--accent) 0%, #ff8c42 40%, var(--cyan) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}

.tagline{font-size:12px;letter-spacing:5px;color:var(--muted);text-transform:uppercase}

.last-update{
  display:inline-flex;align-items:center;gap:8px;
  margin-top:14px;padding:6px 16px;
  border:1px solid var(--border);border-radius:99px;
  font-size:12px;color:var(--muted);
  background:rgba(255,255,255,.03);
}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);
     box-shadow:0 0 8px var(--green);animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

/* ── STATUS LOADER ── */
#statusBar{
  text-align:center;padding:50px 20px;
  font-size:15px;color:var(--muted);letter-spacing:2px;
}
.spinner{
  width:36px;height:36px;border:3px solid var(--border);
  border-top-color:var(--cyan);border-radius:50%;
  animation:spin 1s linear infinite;margin:0 auto 16px;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── KPI GRID ── */
.kpi-row{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:14px;margin-bottom:40px;
}
.kpi{
  background:var(--card);border:1px solid var(--border);
  border-radius:16px;padding:22px 18px;text-align:center;
  position:relative;overflow:hidden;transition:.3s;
}
.kpi::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,var(--accent),var(--cyan));
}
.kpi:hover{transform:translateY(-5px);border-color:var(--cyan);
           box-shadow:0 10px 35px var(--glow-c)}
.kpi-val{
  font-family:'Orbitron',sans-serif;font-size:34px;font-weight:700;
  color:var(--cyan);line-height:1;
}
.kpi-lbl{font-size:10px;letter-spacing:3px;color:var(--muted);
          text-transform:uppercase;margin-top:6px}

/* ── SECTION LABEL ── */
.sec{
  font-family:'Orbitron',sans-serif;font-size:11px;
  letter-spacing:4px;text-transform:uppercase;
  color:var(--muted);margin-bottom:18px;
  display:flex;align-items:center;gap:12px;
}
.sec::after{content:'';flex:1;height:1px;background:var(--border)}

/* ── PODIUM ── */
.podium{
  display:flex;align-items:flex-end;justify-content:center;
  gap:12px;margin-bottom:52px;
}

.p-block{
  flex:1;max-width:240px;border-radius:18px 18px 0 0;
  padding:22px 16px 18px;text-align:center;
  position:relative;overflow:hidden;cursor:default;transition:.3s;
}
.p-block:hover{transform:translateY(-8px)}
.p-block::after{
  content:'';position:absolute;inset:0;opacity:.04;
  background:repeating-linear-gradient(45deg,#fff 0,#fff 1px,transparent 0,transparent 50%);
  background-size:8px 8px;pointer-events:none;
}

.p1{
  background:linear-gradient(160deg,#241a00,#160f00);
  border:1px solid var(--gold);min-height:210px;
  animation:pulse-gold 3s ease-in-out infinite;
}
@keyframes pulse-gold{
  0%,100%{box-shadow:0 0 25px rgba(255,215,0,.2)}
  50%{box-shadow:0 0 55px rgba(255,215,0,.5),0 0 80px rgba(255,215,0,.15)}
}
.p2{background:linear-gradient(160deg,#1a1a22,#101018);border:1px solid var(--silver);min-height:170px}
.p3{background:linear-gradient(160deg,#1c1000,#110900);border:1px solid var(--bronze);min-height:138px}

.p-crown{font-size:36px;display:block;margin-bottom:4px;animation:levitate 3.5s ease-in-out infinite}
.p2 .p-crown{animation-delay:.8s}.p3 .p-crown{animation-delay:1.5s}

.p-pos{font-family:'Orbitron',sans-serif;font-size:11px;letter-spacing:3px;margin-bottom:6px}
.p1 .p-pos{color:var(--gold)}.p2 .p-pos{color:var(--silver)}.p3 .p-pos{color:var(--bronze)}

.p-name{font-size:16px;font-weight:700;margin-bottom:10px;line-height:1.2}

.p-score{font-family:'Orbitron',sans-serif;font-size:38px;font-weight:900;line-height:1}
.p1 .p-score{color:var(--gold);text-shadow:0 0 20px rgba(255,215,0,.6)}
.p2 .p-score{color:var(--silver)}
.p3 .p-score{color:var(--bronze)}

.p-sub{font-size:11px;color:var(--muted);margin-top:6px}

.p-badge{
  position:absolute;top:-1px;left:50%;transform:translateX(-50%);
  background:var(--gold);color:#000;font-size:9px;font-weight:800;
  padding:3px 12px;border-radius:0 0 8px 8px;letter-spacing:2px;
  display:none;
}
.p1 .p-badge{display:block}

/* ── RANKING TABLE ── */
.r-wrap{display:flex;flex-direction:column;gap:6px}

.r-row{
  display:grid;
  grid-template-columns:48px 1fr 90px 1fr 60px;
  align-items:center;gap:12px;
  background:var(--card);border:1px solid var(--border);
  border-radius:12px;padding:14px 18px;
  transition:.25s;cursor:default;
}
.r-row:hover{background:#14144a;border-color:var(--cyan);
             transform:translateX(5px);box-shadow:0 4px 20px var(--glow-c)}

.r-num{
  font-family:'Orbitron',sans-serif;font-size:15px;font-weight:700;
  text-align:center;color:var(--muted);
}
.r-num.g{color:var(--gold)}
.r-num.s{color:var(--silver)}
.r-num.b{color:var(--bronze)}

.r-name{font-size:17px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}

.badge{
  font-size:10px;font-weight:700;padding:2px 8px;
  border-radius:99px;letter-spacing:1px;white-space:nowrap;
}
.b-fire{background:rgba(233,69,96,.12);color:var(--accent);border:1px solid var(--accent)}
.b-star{background:rgba(255,215,0,.1);color:var(--gold);border:1px solid var(--gold)}
.b-ok  {background:rgba(0,230,118,.1);color:var(--green);border:1px solid var(--green)}

.r-score{
  font-family:'Orbitron',sans-serif;font-size:24px;font-weight:700;
  color:var(--accent);text-align:right;
}

.bar-outer{background:rgba(255,255,255,.05);border-radius:99px;height:7px;overflow:hidden}
.bar-inner{height:100%;border-radius:99px;transition:width 1.2s cubic-bezier(.4,0,.2,1);
           background:linear-gradient(90deg,var(--accent),var(--cyan))}
.bar-inner.done{background:linear-gradient(90deg,var(--green),#69f0ae)}

.r-pct{font-size:13px;font-weight:600;text-align:right;color:var(--text)}

/* ── ERROR STATE ── */
#errorBox{
  display:none;text-align:center;padding:50px 20px;
  border:1px solid rgba(233,69,96,.3);border-radius:16px;
  background:rgba(233,69,96,.05);
}
#errorBox .icon{font-size:44px;display:block;margin-bottom:12px}
#errorBox p{color:var(--muted);font-size:15px;line-height:1.7}
#errorBox a{color:var(--cyan);text-decoration:none}

/* Stagger */
.fade{opacity:0;transform:translateY(20px);transition:.5s ease}
.fade.in{opacity:1;transform:translateY(0)}

@media(max-width:620px){
  .r-row{grid-template-columns:36px 1fr 70px;gap:8px}
  .r-row .bar-outer,.r-row .r-pct{display:none}
  .podium{flex-direction:column;align-items:center}
  .p-block{max-width:100%;width:100%;min-height:auto!important;border-radius:14px}
  .p1{order:-1}
}
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div class="wrap">

  <header>
    <span class="crown">👑</span>
    <h1>Ranking de Indicações</h1>
    <p class="tagline">Equipe Comercial</p>
    <div class="last-update">
      <span class="dot"></span>
      <span id="lastUpdate">Conectando ao Google Sheets…</span>
    </div>
  </header>

  <div id="statusBar">
    <div class="spinner"></div>
    Carregando dados da planilha…
  </div>

  <div id="errorBox">
    <span class="icon">⚠️</span>
    <p id="errorMsg">Não foi possível carregar os dados.</p>
  </div>

  <div id="dashboard" style="display:none">
    <div class="kpi-row fade" id="kpiRow">
      <div class="kpi"><div class="kpi-val" id="kTotal">0</div><div class="kpi-lbl">Total Indicações</div></div>
      <div class="kpi"><div class="kpi-val" id="kAtivos">0</div><div class="kpi-lbl">Vendedores Ativos</div></div>
      <div class="kpi"><div class="kpi-val" id="kMedia">0</div><div class="kpi-lbl">Média por Vendedor</div></div>
      <div class="kpi"><div class="kpi-val" id="kLider">—</div><div class="kpi-lbl">Líder do Ranking</div></div>
    </div>

    <p class="sec fade">🥇 Pódio</p>
    <div class="podium fade" id="podium"></div>

    <p class="sec fade">📊 Ranking Completo</p>
    <div class="r-wrap fade" id="rankList"></div>
  </div>

</div>

<script>
// ── Starfield ───────────────────────────────────────────────────────────────
const cv = document.getElementById('canvas');
const cx = cv.getContext('2d');
let ST   = [];

function resize(){ cv.width=innerWidth; cv.height=innerHeight }
resize(); addEventListener('resize',resize);

for(let i=0;i<220;i++) ST.push({
  x:Math.random(), y:Math.random(),
  r:Math.random()*1.5+.2,
  s:Math.random()*.00025+.00008,
  o:Math.random()*.8+.1,
  hue: Math.random()<.3 ? 200 : 0   // cyan tint for some
});

(function anim(){
  cx.clearRect(0,0,cv.width,cv.height);
  ST.forEach(s=>{
    s.y+=s.s; if(s.y>1){s.y=0;s.x=Math.random()}
    cx.beginPath();
    cx.arc(s.x*cv.width, s.y*cv.height, s.r, 0, Math.PI*2);
    const col = s.hue===200 ? `rgba(150,220,255,${s.o})` : `rgba(210,215,255,${s.o})`;
    cx.fillStyle=col; cx.fill();
  });
  requestAnimationFrame(anim);
})();

// ── Google Sheets CSV ───────────────────────────────────────────────────────
const SHEET_ID  = '1KfUrwyRrGhbDuAXrG01B65uq_mAHuKR51HNKJaSdsxA';
const GID       = '1936514463';   // aba INDICAÇÕES
const CSV_URL   = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GID}`;
const REFRESH_S = 60; // auto-refresh a cada 60 segundos

async function fetchData(){
  try {
    const res = await fetch(CSV_URL + '&t=' + Date.now());
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    return parseCSV(text);
  } catch(e){
    throw e;
  }
}

function parseCSV(text){
  const lines = text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);

  // Encontra linha de cabeçalho
  let hIdx = -1;
  for(let i=0;i<lines.length;i++){
    const up = lines[i].toUpperCase();
    if(up.includes('VENDEDOR')){hIdx=i;break}
  }
  if(hIdx<0) throw new Error('Coluna "VENDEDOR" não encontrada na planilha.');

  const headers = splitCSV(lines[hIdx]).map(h=>h.toUpperCase().trim());
  const iNome = headers.findIndex(h=>h.includes('VENDEDOR'));
  const iQtd  = headers.findIndex(h=>h.includes('INDICA')||h.includes('TOTAL'));
  const iMeta = headers.findIndex(h=>h.includes('META'));

  if(iNome<0||iQtd<0) throw new Error('Colunas necessárias não encontradas.\nEsperado: VENDEDOR e TOTAL DE INDICAÇÕES');

  const data=[];
  for(let i=hIdx+1;i<lines.length;i++){
    const cols = splitCSV(lines[i]);
    const nome = (cols[iNome]||'').trim();
    if(!nome || nome.toUpperCase().includes('TOTAL') || nome.toUpperCase().includes('GERAL')) continue;
    const qtd  = parseFloat((cols[iQtd]||'0').replace(/[^\d.,]/g,'').replace(',','.')) || 0;
    const meta = iMeta>=0 ? (parseFloat((cols[iMeta]||'30').replace(/[^\d.,]/g,'').replace(',','.')) || 30) : 30;
    data.push({nome, qtd, meta});
  }
  if(!data.length) throw new Error('Nenhum vendedor encontrado na planilha.');
  return data.sort((a,b)=>b.qtd-a.qtd);
}

function splitCSV(line){
  const res=[]; let cur='', inQ=false;
  for(const ch of line){
    if(ch==='"'){inQ=!inQ}
    else if(ch===','&&!inQ){res.push(cur);cur=''}
    else cur+=ch;
  }
  res.push(cur);
  return res;
}

// ── Render ──────────────────────────────────────────────────────────────────
function render(data){
  document.getElementById('statusBar').style.display='none';
  document.getElementById('errorBox').style.display='none';
  const dash = document.getElementById('dashboard');
  dash.style.display='block';

  const now = new Date();
  document.getElementById('lastUpdate').textContent =
    'Atualizado às ' + now.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});

  // KPIs
  const total  = data.reduce((s,d)=>s+d.qtd,0);
  const ativos = data.filter(d=>d.qtd>0).length;
  const media  = ativos ? (total/ativos).toFixed(1) : '0';
  const lider  = data[0]?.nome.split(' ')[0]||'—';

  countUp('kTotal', total);
  countUp('kAtivos', ativos);
  document.getElementById('kMedia').textContent = media;
  document.getElementById('kLider').textContent = lider;

  // Podium
  const pod = document.getElementById('podium');
  pod.innerHTML='';
  const medals=['👑','🥈','🥉'];
  const cls=['p1','p2','p3'];
  const posLabel=['1º LUGAR','2º LUGAR','3º LUGAR'];
  const order=[1,0,2];

  order.forEach(idx=>{
    if(!data[idx]) return;
    const d=data[idx], pos=idx+1;
    const pct=d.meta ? Math.min(d.qtd/d.meta*100,999).toFixed(0) : '—';
    const div=document.createElement('div');
    div.className=`p-block ${cls[idx]} fade`;
    div.innerHTML=`
      <div class="p-badge">⚡ LÍDER</div>
      <span class="p-crown">${medals[idx]}</span>
      <div class="p-pos">${posLabel[idx]}</div>
      <div class="p-name">${d.nome}</div>
      <div class="p-score" data-t="${d.qtd}">0</div>
      <div class="p-sub">${pct}% da meta</div>`;
    pod.appendChild(div);
    setTimeout(()=>{div.classList.add('in'); countUpEl(div.querySelector('.p-score'),d.qtd)},idx*180);
  });

  // Ranking
  const list=document.getElementById('rankList');
  list.innerHTML='';
  data.forEach((d,i)=>{
    const pct   = d.meta ? Math.min(d.qtd/d.meta*100,100) : 0;
    const over  = d.meta && d.qtd>=d.meta;
    const numCls= i===0?'g':i===1?'s':i===2?'b':'';
    const nums  = ['🥇','🥈','🥉'];
    const numDisp = i<3 ? nums[i] : (i+1);
    const badges=[];
    if(i===0) badges.push('<span class="badge b-star">⚡ LÍDER</span>');
    if(over)  badges.push('<span class="badge b-ok">✓ META</span>');
    if(d.qtd>=20) badges.push('<span class="badge b-fire">🔥 HOT</span>');

    const row=document.createElement('div');
    row.className='r-row fade';
    row.innerHTML=`
      <div class="r-num ${numCls}">${numDisp}</div>
      <div class="r-name">${d.nome}${badges.join('')}</div>
      <div class="r-score" data-t="${d.qtd}">0</div>
      <div class="bar-outer"><div class="bar-inner ${over?'done':''}" style="width:0%" data-p="${pct}"></div></div>
      <div class="r-pct">${d.meta ? Math.min(d.qtd/d.meta*100,999).toFixed(0)+'%':'—'}</div>`;
    list.appendChild(row);
    setTimeout(()=>{
      row.classList.add('in');
      countUpEl(row.querySelector('.r-score'),d.qtd);
    }, i*70);
  });

  setTimeout(()=>{
    document.querySelectorAll('.bar-inner').forEach(el=>{
      el.style.width=el.dataset.p+'%';
    });
  },300);

  // Fade in sections
  document.querySelectorAll('.fade').forEach((el,i)=>{
    setTimeout(()=>el.classList.add('in'),i*60);
  });
}

function showError(msg){
  document.getElementById('statusBar').style.display='none';
  const box=document.getElementById('errorBox');
  box.style.display='block';
  document.getElementById('errorMsg').innerHTML=
    msg + '<br><br>Verifique se a planilha está compartilhada como <strong>"Qualquer pessoa com o link"</strong>.';
}

// ── Counter animation ────────────────────────────────────────────────────────
function countUp(id, target, dur=900){
  countUpEl(document.getElementById(id), target, dur);
}
function countUpEl(el, target, dur=900){
  if(!el) return;
  const start=Date.now();
  (function step(){
    const p=Math.min((Date.now()-start)/dur,1);
    const e=1-Math.pow(1-p,3);
    el.textContent=Math.round(e*target);
    if(p<1) requestAnimationFrame(step);
  })();
}

// ── Init + auto-refresh ──────────────────────────────────────────────────────
async function load(){
  try{
    const data=await fetchData();
    render(data);
  }catch(e){
    showError(e.message||'Erro desconhecido');
  }
}

load();
setInterval(load, REFRESH_S * 1000);
</script>
</body>
</html>
